<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>WebAR — Зелёный шарик на носу</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>

  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
    a-scene { width: 100vw; height: 100vh; }
    video { z-index: 1 !important; }
    canvas { z-index: 2 !important; }
  </style>
</head>
<body>
  <a-scene
    mindar-face="filterMinCF: 0.001; filterBeta: 0.01; missTolerance: 10"
    embedded
    color-space="sRGB"
    renderer="alpha: true; colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera active="false" position="0 0 0"></a-camera>

    <!-- anchorIndex: 0 = центр лица (стабильная точка).
         Смещаем шарик вниз-вперёд, чтобы он лёг на кончик носа. -->
    <a-entity mindar-face-target="anchorIndex: 0">
      <a-sphere
        color="green"
        radius="0.02"
        position="0 -0.04 0.05"
        material="shader: standard; roughness: 0.4">
      </a-sphere>
    </a-entity>

    <a-entity light="type: ambient; color: #BBB"></a-entity>
    <a-entity light="type: directional; color: #FFF; intensity: 0.8" position="1 2 1"></a-entity>
  </a-scene>

  <script>
    // Если нужно — можно добавить адаптивный компонент,
    // но для сферы достаточно статичных значений выше.
    AFRAME.registerComponent('adaptive-nose', {
      init: function () {
        const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        // Точная подгонка под конкретное лицо/камеру:
        const mobilePos   = { x: 0, y: -0.04, z: 0.05 };
        const desktopPos  = { x: 0, y: -0.05, z: 0.06 };
        this.el.setAttribute('position', isMobile ? mobilePos : desktopPos);
      }
    });
  </script>
</body>
</html>
