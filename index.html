<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>AR Face Tracking — Debug</title>

  <style>
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: #000; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    /* Оверлей с логом поверх всего */
    #debug {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 9999;
      padding: 10px 12px;
      background: rgba(0, 0, 0, 0.75);
      font-size: 13px;
      line-height: 1.45;
      max-height: 55vh;
      overflow-y: auto;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      box-sizing: border-box;
      pointer-events: none;
    }

    #debug .line { margin: 2px 0; word-break: break-word; }
    #debug .ok    { color: #4ade80; }
    #debug .err   { color: #f87171; }
    #debug .warn  { color: #fbbf24; }
    #debug .info  { color: #93c5fd; }

    /* Большая надпись по центру */
    #bigMsg {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10000;
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      padding: 20px 26px;
      border-radius: 12px;
      text-align: center;
      font-size: 17px;
      max-width: 90vw;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.6);
      pointer-events: none;
      display: none;
    }

    #bigMsg .title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
    #bigMsg .sub   { font-size: 14px; opacity: 0.85; }

    /* Кнопка "показать лог" снизу */
    #toggleLog {
      position: fixed;
      bottom: 12px; right: 12px;
      z-index: 10001;
      padding: 10px 16px;
      border-radius: 20px;
      border: none;
      background: rgba(255, 255, 255, 0.9);
      color: #111;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }
  </style>

  <!-- Порядок ВАЖЕН: A-Frame → MindAR -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>
</head>
<body>

  <!-- Оверлей с логом -->
  <div id="debug"></div>

  <!-- Большое сообщение по центру -->
  <div id="bigMsg">
    <div class="title" id="bigTitle">Загрузка…</div>
    <div class="sub" id="bigSub"></div>
  </div>

  <!-- Кнопка свернуть/показать лог -->
  <button id="toggleLog">Скрыть лог</button>

  <!-- ===================== A-FRAME SCENE ===================== -->
  <a-scene
    mindar-face
    embedded
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera active="false" position="0 0 0"></a-camera>

    <!-- Свет, чтобы сфера была видна при любом рендере -->
    <a-light type="ambient" intensity="1.2"></a-light>
    <a-light type="directional" position="0.5 1 1" intensity="0.7"></a-light>

    <!-- Зелёная сфера на кончике носа (anchorIndex: 1 из документации) -->
    <a-entity mindar-face-target="anchorIndex: 1">
      <a-sphere color="green" radius="0.1"></a-sphere>
    </a-entity>
  </a-scene>

  <!-- ===================== ЛОГИКА + ДИАГНОСТИКА ===================== -->
  <script>
  (function () {
    'use strict';

    const debugEl   = document.getElementById('debug');
    const bigMsgEl  = document.getElementById('bigMsg');
    const bigTitle  = document.getElementById('bigTitle');
    const bigSub    = document.getElementById('bigSub');
    const toggleBtn = document.getElementById('toggleLog');

    let logVisible = true;

    // ---------- Лог в оверлей ----------
    function log(msg, cls) {
      const line = document.createElement('div');
      line.className = 'line ' + (cls || 'info');
      const t = new Date();
      const ts = String(t.getMinutes()).padStart(2, '0') + ':' +
                 String(t.getSeconds()).padStart(2, '0');
      line.textContent = '[' + ts + '] ' + msg;
      debugEl.appendChild(line);
      debugEl.scrollTop = debugEl.scrollHeight;
      // Дублируем в консоль
      const consoleFn = cls === 'err' ? console.error
                      : cls === 'warn' ? console.warn
                      : console.log;
      consoleFn('[AR]', msg);
    }

    // ---------- Большое сообщение по центру ----------
    function showBig(title, sub, color) {
      bigTitle.textContent = title;
      bigSub.textContent = sub || '';
      bigTitle.style.color = color || '#fff';
      bigMsgEl.style.display = 'block';
    }
    function hideBig() {
      bigMsgEl.style.display = 'none';
    }

    // ---------- Кнопка скрыть/показать лог ----------
    toggleBtn.addEventListener('click', () => {
      logVisible = !logVisible;
      debugEl.style.display = logVisible ? 'block' : 'none';
      toggleBtn.textContent = logVisible ? 'Скрыть лог' : 'Показать лог';
    });

    // ==================================================
    // 1. Проверка окружения
    // ==================================================
    const isSecure = location.protocol === 'https:' ||
                     location.hostname === 'localhost' ||
                     location.hostname === '127.0.0.1';

    log('Протокол: ' + location.protocol + '  |  Хост: ' + location.hostname,
        isSecure ? 'ok' : 'err');

    if (!isSecure) {
      showBig(
        '❌ Не HTTPS',
        'Камера работает только по HTTPS или localhost. GitHub Pages это даёт, file:// — нет.',
        '#f87171'
      );
      log('getUserMedia будет недоступен: не HTTPS и не localhost', 'err');
      return;
    }

    // ==================================================
    // 2. Проверка navigator.mediaDevices
    // ==================================================
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showBig(
        '❌ Нет доступа к API камеры',
        'navigator.mediaDevices отсутствует. Обычно это значит: не HTTPS или очень старый браузер.',
        '#f87171'
      );
      log('navigator.mediaDevices недоступен', 'err');
      return;
    }
    log('navigator.mediaDevices доступен', 'ok');

    // ==================================================
    // 3. Проверка загрузки библиотек
    // ==================================================
    if (typeof AFRAME === 'undefined') {
      showBig('❌ A-Frame не загрузился', 'Проверьте интернет и CDN aframe.io', '#f87171');
      log('AFRAME не определён — CDN не загрузился', 'err');
      return;
    }
    log('A-Frame загружен, версия: ' + AFRAME.version, 'ok');

    // MindAR регистрирует компонент mindar-face — проверим через некоторое время
    const checkMindAR = setInterval(() => {
      if (AFRAME.components && AFRAME.components['mindar-face']) {
        clearInterval(checkMindAR);
        log('MindAR Face загружен (компонент mindar-face зарегистрирован)', 'ok');
      }
    }, 200);
    setTimeout(() => {
      if (!AFRAME.components || !AFRAME.components['mindar-face']) {
        clearInterval(checkMindAR);
        log('MindAR Face НЕ загрузился за 8 сек. Проверьте Network → mindar-face-aframe.prod.js', 'err');
        showBig(
          '❌ MindAR не загрузился',
          'CDN jsdelivr не отдал mindar-face-aframe.prod.js. Проверьте интернет / блокировщики.',
          '#f87171'
        );
      }
    }, 8000);

    // ==================================================
    // 4. Запрос камеры отдельно — чтобы точно понять, в чём дело
    // ==================================================
    log('Запрашиваю доступ к камере…', 'info');
    showBig('Запрос камеры…', 'Разрешите доступ в появившемся окне', '#fbbf24');

    navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user' },
      audio: false
    })
    .then(stream => {
      log('Камера получена: ' + stream.getVideoTracks()[0].label, 'ok');
      showBig('✅ Камера работает', 'Инициализация AR…', '#4ade80');
      // Останавливаем тестовый поток — MindAR откроет свой
      stream.getTracks().forEach(t => t.stop());
      setTimeout(hideBig, 1200);
    })
    .catch(err => {
      const name = err.name || 'Error';
      const msg  = err.message || String(err);
      log('Ошибка камеры: ' + name + ' — ' + msg, 'err');

      let hint = '';
      if (name === 'NotAllowedError') {
        hint = 'Вы запретили доступ. Разрешите камеру в настройках сайта и перезагрузите.';
      } else if (name === 'NotFoundError') {
        hint = 'Камера не найдена. Проверьте, что она не занята другим приложением.';
      } else if (name === 'NotReadableError') {
        hint = 'Камера занята другим приложением. Закройте другие вкладки/приложения.';
      } else if (name === 'OverconstrainedError') {
        hint = 'Не удалось подобрать параметры камеры (facingMode: user).';
      } else if (name === 'SecurityError') {
        hint = 'Заблокировано политикой безопасности. Нужен HTTPS.';
      }

      showBig('❌ Камера недоступна', name + ': ' + hint, '#f87171');
    });

    // ==================================================
    // 5. Следим за состоянием сцены и трекинга
    // ==================================================
    const sceneEl = document.querySelector('a-scene');
    const anchorEl = document.querySelector('[mindar-face-target]');

    sceneEl.addEventListener('renderstart', () => {
      log('A-Frame сцена запущена (renderstart)', 'ok');
    });

    sceneEl.addEventListener('loaded', () => {
      log('A-Frame сцена загружена (loaded)', 'ok');
    });

    // MindAR выдаёт событие arReady, когда движок готов
    sceneEl.addEventListener('arReady', () => {
      log('MindAR AR готов (arReady) — ищем лицо…', 'ok');
      showBig('Ищем лицо…', 'Наведите фронтальную камеру на лицо, хорошее освещение', '#93c5fd');
    });

    if (anchorEl) {
      anchorEl.addEventListener('targetFound', () => {
        log('Лицо найдено ✓ (targetFound)', 'ok');
        hideBig();
      });
      anchorEl.addEventListener('targetLost', () => {
        log('Лицо потеряно (targetLost)', 'warn');
        showBig('Лицо потеряно', 'Верните лицо в кадр', '#fbbf24');
      });
    } else {
      log('Не найден [mindar-face-target] в DOM', 'err');
    }

    // Ловим глобальные ошибки
    window.addEventListener('error', (e) => {
      log('JS ошибка: ' + (e.message || e.error), 'err');
    });
    window.addEventListener('unhandledrejection', (e) => {
      log('Promise rejection: ' + (e.reason && e.reason.message || e.reason), 'err');
    });

  })();
  </script>

</body>
</html>
